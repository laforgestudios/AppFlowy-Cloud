name: Laforge images

# Builds the Laforge server images (amd64) and pushes them to GHCR,
# tagged with the branch name and the short commit SHA.
on:
  push:
    branches:
      - 'laforge/phase1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: appflowy_cloud, dockerfile: Dockerfile }
          - { name: appflowy_worker, dockerfile: services/appflowy-worker/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          IMAGE="ghcr.io/${OWNER}/${{ matrix.job.name }}"
          echo "tags=${IMAGE}:${BRANCH},${IMAGE}:sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.job.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PROFILE=release
            FEATURES=
          cache-from: type=gha,scope=${{ matrix.job.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.job.name }}
